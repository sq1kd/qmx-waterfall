# mise owns the toolchain pins and the build/flash/release tasks.
#
# ESP-IDF has no mise backend: it ships its own installer for the compilers.
# `mise run setup` provisions it without install.sh:
#   - clones ESP-IDF into .idf/esp-idf unless IDF_PATH points at a checkout
#   - installs the target toolchains with idf_tools.py
#   - builds the Python environment with uv (IDF_PYTHON_ENV_PATH), pinned by
#     IDF's constraints file

[vars]
idf_version = "v6.1"
target = "esp32s3"
python = "3.14"

[tools]
python = "{{vars.python}}"
uv = "0.13.6"

[env]
# Everything ESP-IDF lives in .idf/, so local runs and CI use the same tree.
# No ambient IDF_PATH/IDF_PYTHON_ENV_PATH is consulted.
IDF_PATH = "{{config_root}}/.idf/esp-idf"
IDF_PYTHON_ENV_PATH = "{{config_root}}/.idf/venv"
IDF_TARGET = "{{vars.target}}"

[task_config]
shell = "bash -c"
includes = ["tasks"]
