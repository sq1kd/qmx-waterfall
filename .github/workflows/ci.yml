name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Install mise only; `install: false` keeps trust/install explicit below.
      - uses: jdx/mise-action@v5
        with:
          version: 2026.8.14
          install: false
          env: false

      - name: Install pinned tools
        run: |
          mise trust
          mise install

      - name: Restore ESP-IDF checkout and toolchains
        uses: actions/cache@v6
        with:
          path: |
            .idf/esp-idf
            ~/.espressif/tools
            ~/.espressif/espidf.constraints.*
          key: esp-idf-${{ runner.os }}-${{ hashFiles('mise.toml') }}
          restore-keys: |
            esp-idf-${{ runner.os }}-

      - name: Provision ESP-IDF and components
        run: mise run setup

      - name: Build
        run: mise run build

      - name: Release image
        run: mise run release

      - uses: actions/upload-artifact@v7
        with:
          name: qmx-waterfall
          path: dist/*.bin
          if-no-files-found: error
